# payments-service switches withdrawal signing to a key bank-rails does not know yet, and
# bank-rails rejects those withdrawals. The investigation can see almost none of it: the
# change feed is down, every metrics query times out, and the only logs left are from the
# last few minutes in two zones, which show that withdrawals fail but not why.

seed: 5110
window: {start: 2026-10-15T16:00:00Z, end: 2026-10-15T19:00:00Z}

changes:
  - id: chg:2602
    ts: 2026-10-15T17:18:30Z
    service: payments-service
    kind: config
    actor: lena.fischer
    summary: Switch withdrawal signing to key v4
    details: {withdrawals.signing_key_version: "v3 -> v4"}

effects:
  - {kind: metric, service: payments-service, metric: error_rate, start: 2026-10-15T17:20:00Z, to: 0.06, noise: 0.2}
  - kind: log
    service: payments-service
    level: ERROR
    template: "withdrawal {id} failed: bank-rails call returned an error"
    start: 2026-10-15T17:20:00Z
    rate_per_min: 5
    fields: {id: {uniform: [700000, 799999]}}
  - kind: log
    service: edge-gateway
    level: WARN
    template: "upstream payments-service returned 502 (route POST /v1/withdrawals)"
    start: 2026-10-15T17:21:00Z
    rate_per_min: 4

faults:
  - {tool: get_change_history, kind: unavailable}
  - {tool: query_metrics, kind: timeout}
  - {tool: query_logs, kind: partial, missing_az: az-a, missing_before: 2026-10-15T17:48:00Z}
