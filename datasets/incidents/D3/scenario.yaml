    start: 2026-10-16T14:31:20Z
    end: 2026-10-16T14:32:00Z
    count: 3
  - {kind: metric, service: portfolio-service, metric: error_rate, start: 2026-10-16T14:33:00Z, shape: ramp, ramp_minutes: 2, to: 0.22, noise: 0.1}
  - kind: log
    service: portfolio-service
    level: ERROR
    template: "GET /v1/portfolio/positions failed: JsonMappingException: cannot serialize Decimal('NaN') in field unrealized_pnl (account {account})"
    start: 2026-10-16T14:33:00Z
    rate_per_min: 30
    fields: {account: {uniform: [100000, 999999]}}
  - {kind: metric, service: edge-gateway, metric: error_rate, start: 2026-10-16T14:34:00Z, shape: ramp, ramp_minutes: 2, to: 0.04, noise: 0.12}

  # The batch-size change makes market-data a little busier, and nothing else.
  - {kind: metric, service: market-data-service, metric: cpu_util, start: 2026-10-16T14:21:00Z, factor: 1.1}

