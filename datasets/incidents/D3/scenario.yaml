# portfolio-service v5.3.0 switches its positions serializer to a new decimal library that
# cannot encode NaN, which unrealised P&L takes for instruments without a price. Positions
# requests fail fast with 500s. The observability backends are struggling at the same time:
# the first metrics queries time out, and the log shard for az-c is unavailable.

seed: 3003
window: {start: 2026-10-16T13:00:00Z, end: 2026-10-16T16:00:00Z}

changes:
