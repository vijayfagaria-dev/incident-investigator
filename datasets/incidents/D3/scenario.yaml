    ts: 2026-10-16T13:22:48Z
    service: auth-service
    kind: deploy
    actor: ci/deploy-bot
    summary: "auth-service v8.1.4: tighten session cookie flags"
    details: {version: "8.1.4", previous_version: "8.1.3", commit: c07e1a2, diff: "+18 / -6"}
  - id: chg:2338
    ts: 2026-10-16T14:20:05Z
    service: market-data-service
    kind: config
    actor: ana.costa
    summary: Raise quotes batch size from 50 to 100
    details: {quotes.batch_size: "50 -> 100"}
  - id: chg:2341
    ts: 2026-10-16T14:31:10Z
    service: portfolio-service
    kind: deploy
    actor: ci/deploy-bot
    summary: "portfolio-service v5.3.0: move positions serializer to fastdecimal"
    details: {version: "5.3.0", previous_version: "5.2.3", commit: 7d3b9fe, diff: "+214 / -96"}

