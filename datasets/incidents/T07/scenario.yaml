# Market open brings four times the usual order flow. notification-service runs out of CPU
# and its consumer lag grows. A deploy at 13:12 swapped the SMTP client and logs a
# deprecation warning on every send, but throughput was fine until the market opened.

seed: 5107
window: {start: 2026-10-12T12:00:00Z, end: 2026-10-12T15:00:00Z}

changes:
  - id: chg:2571
    ts: 2026-10-12T13:12:40Z
    service: notification-service
    kind: deploy
    actor: ci/deploy-bot
    summary: "notification-service v3.9.0: switch to new SMTP client library"
    details: {version: "3.9.0", previous_version: "3.8.4", commit: d1e07b9, diff: "+530 / -470"}

effects:
  - kind: log
    service: notification-service
    level: INFO
    template: "application started: notification-service 3.9.0 (commit d1e07b9)"
    start: 2026-10-12T13:12:50Z
    end: 2026-10-12T13:14:00Z
    count: 2
  - kind: log
    service: notification-service
    level: WARN
    template: "config key smtp.pool_size is deprecated; use smtp.max_connections"
    start: 2026-10-12T13:13:00Z
    rate_per_min: 8

  # Market open.
  - {kind: metric, service: edge-gateway, metric: rps, start: 2026-10-12T13:30:00Z, shape: ramp, ramp_minutes: 5, factor: 2.4}
  - {kind: metric, service: orders-service, metric: rps, start: 2026-10-12T13:30:00Z, shape: ramp, ramp_minutes: 5, factor: 3.6}
  - {kind: metric, service: orders-service, metric: cpu_util, start: 2026-10-12T13:30:00Z, shape: ramp, ramp_minutes: 5, factor: 1.8}
  - {kind: metric, service: kafka, metric: messages_in_per_s, start: 2026-10-12T13:30:00Z, shape: ramp, ramp_minutes: 5, factor: 4}
  - {kind: metric, service: notification-service, metric: cpu_util, start: 2026-10-12T13:31:00Z, shape: ramp, ramp_minutes: 4, to: 0.96, noise: 0.02}
  - {kind: metric, service: notification-service, metric: consumer_lag, start: 2026-10-12T13:32:00Z, shape: ramp, ramp_minutes: 30, to: 160000, noise: 0.05}
  - kind: log
    service: notification-service
    level: WARN
    template: "consumer group notify-trades is {lag} messages behind"
    start: 2026-10-12T13:40:00Z
    rate_per_min: 2
    fields: {lag: {uniform: [40000, 160000]}}
