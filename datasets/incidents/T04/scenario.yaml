  - {kind: metric, service: orders-service, metric: error_rate, start: 2026-10-08T15:23:00Z, to: 0.03, noise: 0.2}
  - kind: log
    service: orders-service
    level: ERROR
    template: "order {order} failed: ArithmeticException: Non-terminating decimal expansion; no exact representable decimal result (at PricingPathV2.applyCollar)"
    start: 2026-10-08T15:23:00Z
    rate_per_min: 12
    fields: {order: {uniform: [5000000, 5999999]}}
  - {kind: metric, service: edge-gateway, metric: error_rate, start: 2026-10-08T15:23:00Z, to: 0.006, noise: 0.25}
  - kind: log
    service: edge-gateway
    level: WARN
    template: "upstream orders-service returned 500 (route POST /v1/orders)"
    start: 2026-10-08T15:23:00Z
    rate_per_min: 11
