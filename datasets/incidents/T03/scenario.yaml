    end: 2026-10-07T10:12:20Z
    count: 2
  - kind: log
    service: redis-cache
    level: WARN
    template: "sentinel: +switch-master cache redis-cache-0 -> redis-cache-1"
    start: 2026-10-07T10:12:20Z
    end: 2026-10-07T10:12:40Z
    count: 1
  - kind: log
    service: redis-cache
    level: WARN
    template: "promoted replica had not finished full resync; serving from empty keyspace"
    start: 2026-10-07T10:12:30Z
    end: 2026-10-07T10:12:50Z
    count: 1
  - {kind: metric, service: redis-cache, metric: hit_ratio, start: 2026-10-07T10:13:00Z, end: 2026-10-07T10:28:00Z, to: 0.2}
  - {kind: metric, service: redis-cache, metric: hit_ratio, start: 2026-10-07T10:28:00Z, to: 0.45}

  # Cache misses fall through to the orders database.
