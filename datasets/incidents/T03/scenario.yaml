# The redis-cache primary stops answering and Sentinel promotes a replica that had not
# finished resyncing, so the cache comes back empty. Every cache miss falls through to
# postgres-orders, which saturates. Sessions stored in redis are lost too.

seed: 5103
window: {start: 2026-10-07T09:00:00Z, end: 2026-10-07T12:00:00Z}

changes:
  - id: chg:2519
    ts: 2026-10-07T09:31:44Z
    service: postgres-orders
    kind: config
    actor: marta.silva
    summary: Raise work_mem for reporting queries
    details: {work_mem: "4MB -> 8MB", applied: reload}
  - id: chg:2522
    ts: 2026-10-07T09:58:10Z
    service: payments-service
    kind: deploy
    actor: ci/deploy-bot
    summary: "payments-service v7.3.1: update bank-rails client"
    details: {version: "7.3.1", previous_version: "7.3.0", commit: 52e9b14, diff: "+64 / -30"}

effects:
