# A config change meant for staging shrinks the payments database connection pool from
# 50 to 5. Requests queue for a connection and time out. Thirty-five seconds later an
# unrelated notification-service deploy goes out and starts logging harmless warnings.

seed: 2002
window: {start: 2026-10-20T08:00:00Z, end: 2026-10-20T11:00:00Z}

changes:
  - id: chg:2271
    ts: 2026-10-20T08:41:10Z
    service: portfolio-service
    kind: deploy
    actor: ci/deploy-bot
    summary: "portfolio-service v5.2.3: fix rounding in performance chart"
    details: {version: "5.2.3", previous_version: "5.2.2", commit: 9f2c1e7, diff: "+12 / -4"}
  - id: chg:2284
    ts: 2026-10-20T09:15:42Z
    service: auth-service
    kind: feature_flag
    actor: priya.nair
    summary: Enable remember_device for all web sessions
    details: {flag: remember_device, rollout: "50% -> 100%"}
  - id: chg:2290
    ts: 2026-10-20T10:02:05Z
    service: payments-service
    kind: config
    actor: config-bot
    summary: "Apply connection tuning from PR #4821"
    details: {db.pool.max_size: "50 -> 5", db.pool.idle_timeout_s: "30 -> 10", pr: "#4821"}
  - id: chg:2291
    ts: 2026-10-20T10:02:40Z
    service: notification-service
    kind: deploy
    actor: ci/deploy-bot
    summary: "notification-service v3.8.1: new email template renderer"
    details: {version: "3.8.1", previous_version: "3.7.4", commit: 51ab0d3, diff: "+1,204 / -310"}

effects:
  # Pods reload config within a minute; the pool caps at five connections.
  - kind: log
    service: payments-service
    level: INFO
    template: "configuration reloaded: db.pool.max_size=5 db.pool.idle_timeout_s=10"
    start: 2026-10-20T10:02:20Z
    end: 2026-10-20T10:02:50Z
    count: 3
  - {kind: metric, service: payments-service, metric: db_pool_max_connections, start: 2026-10-20T10:03:00Z, to: 5, noise: 0}
  - {kind: metric, service: payments-service, metric: db_pool_in_use, start: 2026-10-20T10:03:00Z, to: 5, noise: 0}
  - {kind: metric, service: payments-service, metric: latency_p50_ms, start: 2026-10-20T10:04:00Z, shape: ramp, ramp_minutes: 3, to: 950}
  - {kind: metric, service: payments-service, metric: latency_p99_ms, start: 2026-10-20T10:04:00Z, shape: ramp, ramp_minutes: 3, to: 4200}
  - {kind: metric, service: payments-service, metric: error_rate, start: 2026-10-20T10:04:00Z, shape: ramp, ramp_minutes: 3, to: 0.15, noise: 0.12}
  - kind: log
    service: payments-service
    level: ERROR
    template: "HikariPool-1 - Connection is not available, request timed out after {ms}ms (total=5, active=5, idle=0, waiting={waiting})"
    start: 2026-10-20T10:04:00Z
    rate_per_min: 34
    fields: {ms: {uniform: [3000, 3006]}, waiting: {uniform: [18, 61]}}

  # The database is fine; it simply receives fewer connections and less work.
  - {kind: metric, service: postgres-payments, metric: active_connections, start: 2026-10-20T10:03:00Z, factor: 0.45}
  - {kind: metric, service: postgres-payments, metric: cpu_util, start: 2026-10-20T10:03:00Z, factor: 0.7}

  # The gateway surfaces the failures on the checkout route.
  - {kind: metric, service: edge-gateway, metric: error_rate, start: 2026-10-20T10:05:00Z, shape: ramp, ramp_minutes: 3, to: 0.035, noise: 0.12}
  - {kind: metric, service: edge-gateway, metric: latency_p99_ms, start: 2026-10-20T10:05:00Z, shape: ramp, ramp_minutes: 3, to: 2100}
  - kind: log
    service: edge-gateway
    level: WARN
    template: "upstream payments-service timed out after 5000ms (route /v1/checkout)"
    start: 2026-10-20T10:05:00Z
    rate_per_min: 12

  # Red herring: the new template renderer warms its cache and is a little busier.
  - {kind: metric, service: notification-service, metric: cpu_util, start: 2026-10-20T10:03:00Z, end: 2026-10-20T10:30:00Z, factor: 1.35}
  - kind: log
    service: notification-service
    level: WARN
    template: "template cache miss for {template}; rendering from source"
    start: 2026-10-20T10:03:00Z
    end: 2026-10-20T10:30:00Z
    rate_per_min: 9
    fields: {template: {choice: [trade_confirmation, deposit_received, price_alert, weekly_summary]}}
