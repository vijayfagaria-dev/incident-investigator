[project]
name = "incident-investigator"
version = "1.0.0"
description = "Multi-agent investigation of production incidents with evidence-backed root-cause reports."
readme = "README.md"
authors = [
    { name = "vijayfagaria-dev" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
investigator = "investigator.cli:app"

[project.optional-dependencies]
ui = [
    "streamlit>=1.66.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "investigator"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplifications
    "RUF",     # ruff-specific
    "ASYNC",   # asyncio pitfalls
    "PT",      # pytest style
    "T20",     # stray print()
    "ERA",     # commented-out code
    "FIX",     # unresolved TODO/FIXME/XXX
]

[tool.ruff.lint.per-file-ignores]
# Live smoke tests are run by hand to see latency and token use, so they print.
"tests/live/*" = ["T201"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not live"]
markers = ["live: calls a real LLM provider and needs an API key"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
